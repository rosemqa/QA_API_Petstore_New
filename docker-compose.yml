services:
  api_tests:
    image: gitlab # tests
    build: .
    volumes:
      - .:/test_project
    command: /bin/sh -c "pytest --alluredir=allure_results/ --reruns 3 -v"

  report:
    image: gitlab # tests
    build: .
    volumes:
      - .:/test_project
    command: /bin/sh -c "allure generate allure_results --clean -o allure_report"
